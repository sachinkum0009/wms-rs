[package]
name = "wms_core"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
paho-mqtt = "0.13.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }

[[bin]]
name = "wms_cli"
path = "bin/wms_cli.rs"
